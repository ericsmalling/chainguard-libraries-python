name: Update pylock.toml hashes

# Refresh the integrity hashes in pip/pylock.toml with the checksums that
# Chainguard Libraries publishes, then open a PR if anything changed.

on:
  workflow_dispatch:
    inputs:
      remediated:
        description: Pull hashes from the python-remediated catalog (*+cgr.N builds)
        type: boolean
        default: false
  schedule:
    # Mondays at 13:00 UTC
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC federation to the Chainguard assumable identity
    steps:
      - uses: actions/checkout@v6

      - uses: chainguard-dev/setup-chainctl@v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Update hashes from Chainguard Libraries
        working-directory: pip
        shell: bash
        env:
          CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
          REMEDIATED: ${{ inputs.remediated }}
        run: |
          set -euo pipefail

          if [[ -z "${CHAINGUARD_ORG:-}" ]]; then
            echo "::error::Set the CHAINGUARD_ORG repository variable to the organization holding the Python entitlement."
            exit 1
          fi

          # setup-chainctl logs in with the console-api audience, which the
          # libraries registry does not accept. update-hashes falls back to
          # 'chainctl auth pull-token'; --parent skips the org prompt so the
          # command stays non-interactive. --ignore-netrc keeps any ambient
          # .netrc entry from shadowing that.
          args=(pylock.toml --ignore-netrc --parent "$CHAINGUARD_ORG")
          if [[ "$REMEDIATED" == "true" ]]; then
            args+=(--remediated)
          fi

          chainctl libraries update-hashes "${args[@]}"

      - name: Summarize the diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pip/pylock.toml; then
            echo "No hash changes." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '```diff'
              git diff -- pip/pylock.toml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: pip/pylock.toml
          branch: chainguard/update-pylock-hashes
          delete-branch: true
          commit-message: "chore(pip): update pylock.toml hashes from Chainguard Libraries"
          title: "chore(pip): update pylock.toml hashes from Chainguard Libraries"
          labels: chainguard-libraries
          body: |
            `chainctl libraries update-hashes` refreshed the integrity hashes in
            `pip/pylock.toml` with the checksums published by Chainguard
            Libraries${{ inputs.remediated == true && ' (python-remediated catalog)' || '' }}.

            Generated by [`update-pylock-hashes.yml`](.github/workflows/update-pylock-hashes.yml)
            — see the run summary for the diff.
